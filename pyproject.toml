[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

###########################################################
# Project Metadata
###########################################################

[project]
name = "retrieval-benchmark"
version = "0.1.0"

description = "CPU-first retrieval benchmarking framework for sparse, dense, hybrid, reranking, ColBERT, and HyDE retrieval evaluation."

readme = "README.md"

requires-python = ">=3.10"

license = { text = "MIT" }

authors = [
    { name = "Retrieval Benchmark Framework Team" }
]

keywords = [
    "retrieval",
    "information-retrieval",
    "benchmarking",
    "bm25",
    "dense-retrieval",
    "colbert",
    "hyde",
    "semantic-search",
    "nlp",
    "cpu"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [

    # core
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",

    # ML / NLP
    "torch>=2.3.0",
    "transformers>=4.52.0",
    "sentence-transformers>=3.0.0",

    # retrieval
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",

    # datasets
    "datasets>=2.20.0",
    "beir>=2.0.0",

    # evaluation
    # cli / logging
    "rich>=13.9.0",
    "typer>=0.12.3",

    # profiling
    "psutil>=6.0.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
]

###########################################################
# Optional Dependency Groups
###########################################################

[project.optional-dependencies]

dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "isort>=5.13.0"
]

notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "notebook>=7.2.0"
]

retrieval_extra = [
    "pyserini>=0.38.0",
    "colbert-ai>=0.2.20"
]

hyde = [
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0"
]

evaluation = [
    "pytrec_eval>=0.5",
]

###########################################################
# Setuptools Package Discovery
###########################################################

[tool.setuptools]
package-dir = {"" = "src"}
py_modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

###########################################################
# Black
###########################################################

[tool.black]
line-length = 88
target-version = ["py310"]

###########################################################
# Ruff
###########################################################

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]

ignore = [
    "E501"
]

###########################################################
# isort
###########################################################

[tool.isort]
profile = "black"
line_length = 88

###########################################################
# Pytest
###########################################################

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = """
-v
--tb=short
--strict-markers
"""

###########################################################
# Coverage
###########################################################

[tool.coverage.run]

source = [
    "src"
]

branch = true

[tool.coverage.report]

show_missing = true
skip_covered = true

###########################################################
# CLI Entry Point
###########################################################

[project.scripts]

retrieval-bench = "cli:main"
retrieval-benchmark = "cli:main"

###########################################################
# Notes
###########################################################

# Install base package:
#
#   pip install -e .
#
# Install dev environment:
#
#   pip install -e ".[dev]"
#
# Install notebook extras:
#
#   pip install -e ".[notebooks]"
#
# Install everything:
#
#   pip install -e ".[dev,notebooks,retrieval_extra,hyde]"
#